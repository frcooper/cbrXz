name: Commitlint

# This repo releases straight from pushes to master, and semantic-release
# parses those commit messages. Linting only on pull_request meant the release
# pipeline's only input was never validated.
on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to get all commits in the PR
      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
