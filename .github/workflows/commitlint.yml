name: Commitlint

# semantic-release reads the commit messages on master to choose the next
# version and write the changelog. PRs are squash-merged with the PR title as
# the subject, so lint pushes to master as well as the PR's own commits.
on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to get all commits in the PR
      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
