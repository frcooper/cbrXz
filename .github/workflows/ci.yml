name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Skip CI based on PR labels/titles or commit message markers
    if: >-
      !(
        github.event_name == 'pull_request' && (
          startsWith(github.event.pull_request.title, 'skip ci') ||
          startsWith(github.event.pull_request.title, 'ci skip') ||
          contains(github.event.pull_request.title, '[skip ci]') ||
          contains(github.event.pull_request.title, '[ci skip]') ||
          contains(github.event.pull_request.labels.*.name, 'skip-ci')
        )
      ) &&
      !(
        github.event_name == 'push' && (
          contains(github.event.head_commit.message, '[skip ci]') ||
          contains(github.event.head_commit.message, '[ci skip]') ||
          startsWith(github.event.head_commit.message, 'skip ci') ||
          startsWith(github.event.head_commit.message, 'ci skip')
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/fixtures/* are Git LFS objects. Without this they check out as
          # ~130 byte pointer files, so the archive tests compare pointers to
          # pointers and the real .cbr extraction path is never exercised.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # rarfile shells out to an extractor; Windows runners ship 7-Zip on PATH.
      - name: Install RAR extractor (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail loudly here rather than letting the tests silently fall back to
      # their "not a real RAR" branch when LFS or the extractor is missing.
      - name: Verify LFS fixtures and RAR extractor
        run: python -c "import os, tempfile, rarfile; d = tempfile.mkdtemp(); rarfile.RarFile('tests/fixtures/testfile.cbr').extractall(d); print('RAR extractor OK -', len(os.listdir(d)), 'entries')"

      - name: Run tests
        run: pytest -q
