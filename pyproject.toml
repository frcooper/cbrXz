[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbrXz"
version = "1.3.0"
description = "Normalize comic archives: convert .cbr/.rar to .cbz and mirror/copy other supported types."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "frcooper" }]
requires-python = ">=3.8"
dependencies = [
  "click>=8",
  "rarfile>=4",
]
keywords = ["comics", "cbr", "cbz", "rar", "zip"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "License :: Other/Proprietary License",
]

# This project uses a single-module layout: package the top-level cbrXz.py
[tool.setuptools]
py-modules = ["cbrXz"]

[project.scripts]
# This exposes a console command `cbrXz` that runs the click CLI main() in cbrXz.py
cbrXz = "cbrXz:main"

[project.urls]
Homepage = "https://github.com/frcooper/cbrXz"
Repository = "https://github.com/frcooper/cbrXz"

[tool.semantic_release]
# NB: `branch`, `upload_to_pypi`, `upload_to_release`, `changelog_file` and
# `changelog_sections` were v7 keys. v8+ ignores unknown keys silently, so they
# had no effect; the ones that still matter are in their sub-tables below.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
build_command = ""

[tool.semantic_release.branches.master]
match = "master"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = true
